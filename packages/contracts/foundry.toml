[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
deny = "warnings"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
