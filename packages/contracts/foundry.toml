[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
deny = "warnings"
# The deploy, agent and proof scripts read and write deployments/monad-mainnet.json. That folder is
# the only part of the disk a script can reach.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# Two exceptions to deny-on-warning, both about code that is never deployed as ours.
# The Chainlink receiver template is vendored verbatim, license header and all, so its style is
# theirs to set. Linting it would only tempt us to edit code we must not change.
# Test files trip the deployment lints by design: they cast timestamps, send value to fuzzed
# addresses and ignore return values on purpose.
ignore = [
    "src/vendor/chainlink/ReceiverTemplate.sol",
    "src/vendor/chainlink/IReceiver.sol",
    "src/vendor/chainlink/IERC165.sol",
    "test/*.sol",
    "test/mocks/*.sol",
    "test/utils/*.sol",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"

# Monadscan is Etherscan style and needs an API key Ram has not created yet, so the key may be
# empty here. Sourcify verification through MonadVision needs no key and is the default path.
[etherscan]
monad = { key = "${MONADSCAN_API_KEY}", chain = 143, url = "https://api.monadscan.com/api" }
