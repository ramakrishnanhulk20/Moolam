# Which environment variable holds the value behind each secret id the enclave asks for.
# Only names live here. The value is never written to a file in this repo.
#
# The run exports CRE_SEALED_FETCH_KEY in the shell before calling the simulator. For the passing
# run it is the Pinata account token from the repository root .env; for the negative run it is a
# wrong value, which is the only difference between the two runs.
secretsNames:
    SEALED_FETCH_KEY:
        - CRE_SEALED_FETCH_KEY
