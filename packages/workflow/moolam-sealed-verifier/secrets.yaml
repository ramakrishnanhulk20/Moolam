# Which environment variable holds the value behind each secret id the enclave asks for.
# Only names live here. The value is never written to a file in this repo.
#
# SEALED_LINK_TOKEN is the bearer token the verify service's POST /sealed/link checks. The runner
# refuses a sealed run when the env file it hands the CRE CLI with -e has no CRE_SEALED_LINK_TOKEN.
secretsNames:
    SEALED_LINK_TOKEN:
        - CRE_SEALED_LINK_TOKEN
