# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: moolam
description: Moolam passport registry index on Monad
contracts:
  - name: MoolamRegistry
    abi_file_path: ./abis/MoolamRegistry.json
    handler: src/EventHandlers.ts
    events:
      - event: PasskeyBound
      - event: PassportRegistered
      - event: VerificationAttested
      - event: PassportFlagged
      - event: DisputeResolved
      - event: Transfer
  - name: VerifierPolicy
    abi_file_path: ./abis/VerifierPolicy.json
    handler: src/EventHandlers.ts
    events:
      - event: ReceiverAdded
      - event: ReceiverRemoved
# Every passport row records the transaction that created it, so the app can link
# straight to the explorer without a second lookup.
field_selection:
  transaction_fields:
    - hash
chains:
  - id: 143
    # The block the three contracts were deployed in on Monad mainnet, from
    # packages/contracts/deployments/monad-mainnet.json. Nothing this index cares
    # about exists before it, so starting earlier only costs sync time.
    start_block: 103054771
    contracts:
      - name: MoolamRegistry
        address: "0xa19188801E5DC93CD925884d73e4DaFc2bcb80C0"
      - name: VerifierPolicy
        address: "0x54e8Ed8c2c3Cf2A36F8B3AC4c7f02acFD2455821"
