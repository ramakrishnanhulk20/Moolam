type Passport {
  id: ID!
  creator: Creator! @index
  parent: Passport @index
  children: [Passport!]! @derivedFrom(field: "parent")
  root: Passport! @index
  depth: Int! @index
  generator: Generator @index
  kind: Int! @index
  phash: BigInt! @index
  blockhash: String!
  manifestHash: String!
  fingerprintVersion: Int!
  metadataURI: String!
  owner: String! @index
  # The first wallet the creator handed this passport to, and when. Written once
  # and never moved, because a platform's credit goes to the person it handed the
  # picture to first, not to whoever bought it later. Null while the creator has
  # never let it go.
  firstTransferTo: String @index
  firstTransferAt: BigInt
  firstTransferBlock: BigInt
  registeredAt: BigInt! @index
  registeredBlock: BigInt!
  txHash: String!
  disputed: Boolean! @index
  # True when this passport is disputed or any passport above it in the edit chain
  # is. The registry marks only the passport a challenge named, so an edit of a
  # picture proven fake reads clean on chain. This field is how the app shows that
  # edit as disputed too.
  inheritedDisputed: Boolean! @index
  attestationCount: Int!
  matchedCount: Int!
  mismatchedCount: Int!
  attestations: [Attestation!]! @derivedFrom(field: "passport")
  dispute: Dispute
  # What the holder says AI may do with this picture, flattened onto the passport
  # so "every picture open to training, newest first" is one indexed query rather
  # than a screen looping over the chain. consentStated separates "said nothing"
  # from "said no": both read as a refusal to a crawler, but only one of them is
  # a choice the holder made.
  consentStated: Boolean! @index
  consentSummary: String! @index
  consentAiTraining: Int!
  consentAiGenerativeTraining: Int!
  consentAiInference: Int!
  consentDataMining: Int!
  consentInfo: String!
  consentAt: BigInt @index
  consentWriter: String
  consentCount: Int!
  consentEntries: [ConsentEntry!]! @derivedFrom(field: "passport")
  # Read from the newest Lookalike rows only (src/lookalike.ts). earlierFound is
  # true when this passport's own newest record came through Chainlink's network,
  # passed the order and distance checks, and names an earlier passport.
  # laterLookalikeCount is how many passports' newest such record names this one;
  # a record that was later replaced counts for nothing.
  earlierFound: Boolean! @index
  laterLookalikeCount: Int! @index
}

# One statement, kept exactly as it was written, keyed "<passportId>-<index>" from
# the event's own index. The register never edits an entry, so this table is the
# history a reader quotes when they need what was allowed on the day they used a
# picture, and the row for a superseded statement stays exactly as it was.
type ConsentEntry {
  id: ID!
  passport: Passport! @index
  index: Int!
  writer: String! @index
  aiTraining: Int!
  aiGenerativeTraining: Int!
  aiInference: Int!
  dataMining: Int!
  summary: String! @index
  constraintInfo: String!
  at: BigInt! @index
  txHash: String!
}

type Creator {
  id: ID!
  passports: [Passport!]! @derivedFrom(field: "creator")
  passportCount: Int!
  editCount: Int!
  passkey: Passkey
  firstSeenAt: BigInt! @index
}

type Passkey {
  id: ID!
  qx: String!
  qy: String!
  nonce: BigInt!
  boundAt: BigInt!
}

type Generator {
  id: ID!
  passports: [Passport!]! @derivedFrom(field: "generator")
  passportCount: Int!
  matchedCount: Int!
  mismatchedCount: Int!
  disputesUpheld: Int!
  trustScore: Int! @index
  firstSeenAt: BigInt!
}

type Attestation {
  id: ID!
  passport: Passport! @index
  receiver: String! @index
  matched: Boolean!
  distance: Int!
  recomputed: String!
  at: BigInt! @index
  # True only for a result the verdict receiver wrote through Chainlink's
  # forwarder at or after the network went live (src/network.ts). A simulator
  # result, or one sent by whoever holds the receiver's keys, stays false.
  network: Boolean! @index
}

# Chainlink's newest look-alike check of one passport, keyed by the passport id.
# A newer record replaces the row. earlierId is the raw id the record named, all
# zeros for "no earlier look-alike found", in which case earlier is null. The row
# is kept whatever it says, so network and valid are what a reader filters on:
# only a row with both true is Chainlink's word about two real passports in the
# right order.
type Lookalike {
  id: ID!
  passport: Passport! @index
  earlier: Passport @index
  earlierId: String! @index
  phashDistance: Int!
  blockhashDistance: Int!
  earlierSealed: Boolean!
  executedAt: BigInt! @index
  blockNumber: BigInt!
  blockTimestamp: BigInt! @index
  txHash: String!
  network: Boolean! @index
  valid: Boolean! @index
}

# The reasons Moolam's resolver published for one settled challenge, keyed
# "<passportId>-<openedAt>" because a passport whose challenge was rejected can
# be challenged again. MoolamDecisions accepts it only from the policy's resolver
# once the registry shows that dispute settled, and takes the outcome and openedAt
# from the registry, so the index stores the event exactly as given.
type Decision {
  id: ID!
  passport: Passport! @index
  openedAt: BigInt! @index
  upheld: Boolean!
  reasonsURI: String!
  resolver: String! @index
  blockTimestamp: BigInt! @index
  txHash: String!
}

type Dispute {
  id: ID!
  passport: Passport! @index
  challenger: String! @index
  bond: BigInt!
  evidenceHash: String!
  evidenceURI: String!
  status: Int! @index
  openedAt: BigInt! @index
  resolvedAt: BigInt
  resolver: String
}

type Receiver {
  id: ID!
  active: Boolean! @index
  since: BigInt!
}

# One marker row per creator per UTC day, keyed "<day>-<creator>". Its only job
# is to answer "have we already counted this creator today", which is what turns
# DailyStats.uniqueCreators into distinct creators active that day.
type CreatorDay {
  id: ID!
}

type DailyStats {
  id: ID!
  registrations: Int!
  edits: Int!
  attestations: Int!
  disputes: Int!
  uniqueCreators: Int!
  consentStatements: Int!
}

type GlobalStats {
  id: ID!
  passports: Int!
  creators: Int!
  generators: Int!
  attestations: Int!
  # The part of attestations Chainlink's network wrote: raised by the same
  # reading that sets Attestation.network, so it can never pass attestations and
  # a simulator run never reaches it.
  networkAttestations: Int!
  disputes: Int!
  # Statements written, against passports that carry one. They differ because a
  # holder can restate, and a chart that showed only the total would make a
  # handful of creators changing their minds look like new pictures arriving.
  consentStatements: Int!
  passportsWithConsent: Int!
}
